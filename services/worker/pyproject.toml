[project]
name = "chiron-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.5.3,<6",
  "httpx>=0.28.1,<1",
  "psycopg[binary]>=3.2.9,<4",
  "pydantic>=2.11.7,<3",
  "pydantic-settings>=2.10.1,<3",
  "prometheus-client>=0.22,<1",
  "sqlalchemy>=2.0.43,<3",
]

[project.optional-dependencies]
embedding = ["fastembed>=0.7,<1"]
eval = [
  "ragas>=0.4.1,<0.5",
  "langchain>=0.3.27,<0.4",
  "langchain-community>=0.3.31,<0.4",
  "langchain-core>=0.3.75,<0.4",
  "langchain-openai>=0.3.33,<0.4",
]
dev = ["pytest>=8.4.1,<9", "ruff>=0.12.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chiron_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
