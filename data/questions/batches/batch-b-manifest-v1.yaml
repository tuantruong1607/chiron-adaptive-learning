version: batch-b-manifest-v1
status: prepared_for_spec_assignment
course_id: rag-intensive
source_blueprint: data/courses/rag-intensive/course-spec-v1.yaml
purpose: >-
  Deterministic quota plan for Batch B candidate generation. This manifest does
  not authorize an LLM run: every cell must first be assigned reviewed concepts,
  learning objectives and versioned evidence packs.
candidate_targets:
  objective: 720
  constructed_response: 90
objective_rules:
  formats: [single_choice, ordering_or_matching, scenario_diagnosis]
  options: [A, B, C, D]
  correct_options_per_item: 1
  variants_per_standard_spec: 3
constructed_response_rules:
  variants_per_brief: 2
  mandatory_human_review: true
preflight_gates:
  - concept_and_learning_objective_assigned
  - evidence_pack_snapshotted
  - source_span_provenance_resolves
  - no_group_or_mutual_exclusion_conflict
  - deterministic_validator_passes
  - duplicate_and_leakage_check_passes
