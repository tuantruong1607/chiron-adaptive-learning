version: course-spec-v1
status: proposed_for_review
course:
  slug: rag-intensive
  title: Chiron AI Comprehensive Assessment
exam:
  total_questions: 100
  duration_minutes: 120
  score_scale: 100
  objective_questions: 90
  constructed_response_questions: 10
  pacing:
    objective_minutes: 60
    constructed_response_minutes: 60
  delivery:
    autosave: true
    resume_supported: true
    objective_order: randomized_within_blueprint_cell
    constructed_response_order: fixed

content_distribution:
  - scope: day-1-to-day-15
    question_count: 65
    objective_count: 61
    constructed_response_count: 4
    rationale: Core AI knowledge and reasoning foundation.
  - scope: track-2
    question_count: 12
    objective_count: 11
    constructed_response_count: 1
    rationale: Extend breadth beyond the foundation and connect to production concepts.
  - scope: track-3
    question_count: 23
    objective_count: 18
    constructed_response_count: 5
    rationale: Deliberately weighted above Track 2 for AI application, infrastructure and product judgment.

track_3_distribution:
  - direction: ai-application
    question_count: 8
    focus: RAG, agent workflows, tool use, retrieval quality, evaluation and user-facing behavior.
  - direction: ai-infrastructure
    question_count: 8
    focus: deployment, tracing, monitoring, reliability, cost, security and data isolation.
  - direction: ai-product
    question_count: 7
    focus: problem framing, evaluation, guardrails, risk, rollout and measurable user value.

objective_blueprint:
  type_mix:
    single_choice: 66
    ordering_or_matching: 8
    scenario_diagnosis: 16
  cognitive_mix:
    recall: 15
    understand: 25
    apply: 35
    analyze: 15
  difficulty_mix:
    easy: 25
    medium: 45
    hard: 20

constructed_response_blueprint:
  type_mix:
    code_or_pseudocode: 2
    system_design: 3
    tracing_and_monitoring_diagnosis: 2
    security_and_data_governance: 2
    guardrail_or_incident_reasoning: 1
  quality_criteria:
    - correctness
    - reasoning_chain
    - trade_offs_and_assumptions
    - observability_or_verification
    - security_or_safety_when_relevant
    - clarity
  required_scenarios:
    - Design monitoring that traces agent, system and quality signals over time, including quality degradation detection.
    - Design a privacy-preserving AI system for a customer with sensitive data requirements.

question_bank_targets:
  candidate_pool:
    objective: 720
    constructed_response: 90
  reviewed_pool:
    objective: 540
    constructed_response: 60
  release_goal: Six parallel 100-question forms with controlled reuse and equivalent blueprint coverage.
  diversity_axes:
    - source concept and learning objective
    - difficulty and cognitive level
    - misconception targeted
    - direct knowledge, scenario diagnosis, debugging and trade-off
    - Vietnamese phrasing and English technical terminology
    - alternate valid system-design approaches for constructed response

publication_policy:
  states:
    - candidate
    - validator_passed
    - expert_reviewed
    - approved
    - published
    - retired
  invariants:
    - Every published item has source spans, concepts, learning objectives and an answer key or rubric.
    - Every constructed-response item has score-band descriptors and acceptable alternative solutions.
    - LLM-generated items remain candidate until validator and human review pass.
